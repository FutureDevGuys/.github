name: Automerge

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      allowRecovery:
        description: "Allow one targeted Renovate recovery run"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: dependency-automerge
  cancel-in-progress: false

jobs:
  sweep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      ARTIFACT_ENCRYPTION_KEY: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Checkout exact automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve exact marker adopters
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/dependency-private"
          python3 .github/scripts/resolve_dependency_automation_adopters.py \
            --organization "$GITHUB_REPOSITORY_OWNER" --output dependency-automation-adopters.json \
            > "$RUNNER_TEMP/dependency-private/adoption.log" 2>&1

      - name: Merge with current evidence and bounded branch recovery
        run: python3 .github/scripts/merge_dependencies.py

      - name: Preserve private diagnostics with encryption
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p encrypted "$RUNNER_TEMP/dependency-private"
          if [ -f dependency-automation-adopters.json ]; then
            cp dependency-automation-adopters.json "$RUNNER_TEMP/dependency-private/"
          fi
          python3 .github/scripts/private_artifacts.py pack \
            --source "$RUNNER_TEMP/dependency-private" --destination encrypted/automerge.tar.gz.gpg

      - name: Publish aggregate outcome summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: automerge-summary
          path: automerge-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve encrypted outcome evidence
        if: always() && hashFiles('encrypted/automerge.tar.gz.gpg') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: automerge-diagnostics-encrypted
          path: encrypted/automerge.tar.gz.gpg
          retention-days: 7

      - name: Request one targeted Renovate recovery
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.allowRecovery) }}
        shell: bash
        run: |
          set -euo pipefail
          recovery="$RUNNER_TEMP/dependency-private/recovery-repositories.json"
          if [ ! -f "$recovery" ]; then exit 0; fi
          repositories="$(jq -r 'join(",")' "$recovery")"
          if [ -z "$repositories" ]; then exit 0; fi
          current_authority_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_authority_sha" = "$GITHUB_SHA"
          gh workflow run renovate.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "repositories=$repositories" -f recovery=true
