name: Renovate

concurrency:
  group: dependency-renovate
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      repoCache:
        description: "Encrypted cache mode"
        type: choice
        default: enabled
        options: [enabled, disabled, reset]
      repositories:
        description: "Optional comma-separated subset of valid marker adopters."
        required: false
        type: string
        default: ""
      dryRun:
        description: "Renovate dry-run mode"
        type: choice
        default: "off"
        options: ["off", lookup, full]
      recovery:
        description: "Recovery pass; do not dispatch another Renovate recovery"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

env:
  # renovate: datasource=docker depName=renovate/renovate
  RENOVATE_IMAGE: renovate/renovate:44.14.7@sha256:64775eb3b7fc6822f6877bfd43d39eb4af6e3334c116160852704da2c219fe81

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      GITHUB_COM_TOKEN: ${{ secrets.GITHUB_COM_TOKEN || secrets.RENOVATE_TOKEN }}
      RENOVATE_GIT_PRIVATE_KEY: ${{ secrets.RENOVATE_GIT_PRIVATE_KEY }}
      RENOVATE_GIT_IGNORED_AUTHORS: ${{ vars.RENOVATE_GIT_IGNORED_AUTHORS }}
      RENOVATE_CONFIG_PRESET: github>${{ github.repository }}:renovate-config#${{ github.sha }}
      RENOVATE_DRY_RUN: ${{ inputs.dryRun != 'off' && inputs.dryRun || '' }}
      RENOVATE_REPOSITORY_CACHE: ${{ inputs.repoCache || 'enabled' }}
      ARTIFACT_ENCRYPTION_KEY: ${{ secrets.RENOVATE_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Checkout exact automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve adopters and authenticated source
        shell: bash
        env:
          REQUESTED_REPOSITORIES: ${{ inputs.repositories || '' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/dependency-private"
          gh api "repos/$GITHUB_REPOSITORY/contents/renovate-config.json?ref=$GITHUB_SHA" --jq .sha >/dev/null
          identity="$(gh api user --jq '"\(.id)+\(.login)"')"
          echo "RENOVATE_GIT_AUTHOR=Renovate Bot <${identity}@users.noreply.github.com>" >> "$GITHUB_ENV"
          python3 .github/scripts/resolve_dependency_automation_adopters.py \
            --organization "$GITHUB_REPOSITORY_OWNER" \
            --requested "$REQUESTED_REPOSITORIES" \
            --output dependency-automation-adopters.json \
            > "$RUNNER_TEMP/dependency-private/adoption.log" 2>&1

      - name: Download previous encrypted lookup and repository cache
        if: ${{ (inputs.repoCache || 'enabled') == 'enabled' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: renovate.yml
          branch: main
          name: renovate-cache-encrypted
          path: cache-download
          if_no_artifact_found: warn

      - name: Restore cache and authenticate registries
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/renovate/cache
          if [ -f cache-download/cache.tar.gz.gpg ]; then
            python3 .github/scripts/private_artifacts.py unpack \
              --source cache-download/cache.tar.gz.gpg --destination /tmp/renovate/cache \
              || echo "Encrypted cache unavailable; starting with a cold cache."
          fi
          sudo chown -R 12021:0 /tmp/renovate/cache
          if [ -n "${DOCKERHUB_USERNAME:-}" ] || [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            test -n "${DOCKERHUB_USERNAME:-}" && test -n "${DOCKERHUB_TOKEN:-}"
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin >/dev/null 2>&1
          fi
          if [ -n "${GHCR_USERNAME:-}" ] || [ -n "${GHCR_TOKEN:-}" ]; then
            test -n "${GHCR_USERNAME:-}" && test -n "${GHCR_TOKEN:-}"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null 2>&1
          fi

      - name: Run authenticated Renovate with bounded recovery
        run: python3 .github/scripts/run_renovate.py

      - name: Encrypt cache and private diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p encrypted "$RUNNER_TEMP/dependency-private"
          if [ -f dependency-automation-adopters.json ]; then
            cp dependency-automation-adopters.json "$RUNNER_TEMP/dependency-private/"
          fi
          if [ -d /tmp/renovate/cache ] && [ "${RENOVATE_REPOSITORY_CACHE}" != "disabled" ]; then
            sudo chown -R "$(id -u):$(id -g)" /tmp/renovate/cache
            python3 .github/scripts/private_artifacts.py pack --source /tmp/renovate/cache --destination encrypted/cache.tar.gz.gpg
          fi
          python3 .github/scripts/private_artifacts.py pack --source "$RUNNER_TEMP/dependency-private" --destination encrypted/diagnostics.tar.gz.gpg

      - name: Preserve encrypted cache
        if: always() && hashFiles('encrypted/cache.tar.gz.gpg') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: renovate-cache-encrypted
          path: encrypted/cache.tar.gz.gpg
          retention-days: 7

      - name: Preserve encrypted diagnostics
        if: always() && hashFiles('encrypted/diagnostics.tar.gz.gpg') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: renovate-diagnostics-encrypted
          path: encrypted/diagnostics.tar.gz.gpg
          retention-days: 7

      - name: Retain only two encrypted cache snapshots
        if: always() && hashFiles('encrypted/cache.tar.gz.gpg') != ''
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --slurp \
            | jq -r '[.[].artifacts[] | select(.name == "renovate-cache-encrypted" and .expired == false)] | sort_by(.created_at) | reverse | .[2:][] | .id' \
            > "$RUNNER_TEMP/dependency-private/obsolete-cache-ids"
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" >/dev/null
          done < "$RUNNER_TEMP/dependency-private/obsolete-cache-ids"

      - name: Trigger centralized automerge follow-up
        if: ${{ success() && (inputs.dryRun == null || inputs.dryRun == 'off') }}
        shell: bash
        run: |
          set -euo pipefail
          current_authority_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_authority_sha" = "$GITHUB_SHA"
          gh workflow run automerge.yml --repo "$GITHUB_REPOSITORY" --ref main -f "allowRecovery=${ALLOW_RECOVERY}"
        env:
          ALLOW_RECOVERY: ${{ !inputs.recovery }}
